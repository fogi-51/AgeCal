    <script>
      // Thorough patch to ensure window.fetch can be assigned or monkey-patched without throwing
      // "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var targets = [
            typeof window !== 'undefined' ? window : null,
            typeof window !== 'undefined' && window.constructor ? window.constructor.prototype : null,
            typeof Window !== 'undefined' ? Window.prototype : null,
            typeof globalThis !== 'undefined' ? globalThis : null
          ];

          var origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = origFetch;

          targets.forEach(function(target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              // Ignore target if locked
            }
          });
        } catch (e) {
          // Non-fatal
        }
      })();
    </script>
